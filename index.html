<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e6d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Shelves">
  <link rel="manifest" href="manifest.webmanifest">
  <title>The Shelves — Clio’s house library</title>
  <style>
    :root {
      --cream: #faf3e8;
      --warm: #f3e6d4;
      --peach: #f0c9a8;
      --coral: #e8a07a;
      --rose: #c97b6b;
      --ink: #4a3428;
      --soft: #7a5c4a;
      --card: #fffdf8;
      --line: rgba(74, 52, 40, 0.12);
      --shadow: rgba(74, 52, 40, 0.14);
      --pin: #b86b5a;
      --open: #a67c52;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: linear-gradient(165deg, var(--cream) 0%, var(--warm) 50%, #edd9c4 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 14px 48px;
      min-height: 100dvh;
    }
    header { text-align: center; margin-bottom: 14px; }
    header h1 {
      margin: 0 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--rose);
      letter-spacing: -0.01em;
    }
    header .sub { margin: 0; color: var(--soft); font-size: 1rem; }
    header .who { margin: 6px 0 0; font-size: 0.85rem; color: var(--soft); opacity: 0.9; }

    .search-wrap { position: sticky; top: 0; z-index: 5; padding: 8px 0 10px; background: linear-gradient(180deg, var(--cream) 70%, transparent); }
    #search {
      width: 100%;
      font-size: 1.1rem;
      padding: 14px 16px;
      border: 1.5px solid var(--peach);
      border-radius: 14px;
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 4px 14px var(--shadow);
      outline: none;
    }
    #search:focus { border-color: var(--coral); }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin: 4px 0 14px; justify-content: center;
    }
    .tab {
      appearance: none; border: none; cursor: pointer;
      padding: 10px 14px; border-radius: 999px;
      font-size: 0.92rem; font-weight: 600;
      background: rgba(255,253,248,0.7);
      color: var(--soft);
      border: 1px solid var(--line);
    }
    .tab[aria-selected="true"] {
      background: var(--rose); color: #fffdf8;
      border-color: var(--rose);
      box-shadow: 0 4px 12px rgba(201,123,107,0.35);
    }
    .tab:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

    .meta-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; color: var(--soft); margin-bottom: 10px; gap: 8px;
    }
    .meta-bar button {
      appearance: none; border: 1px solid var(--line); background: var(--card);
      color: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer;
    }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 14px 12px;
      box-shadow: 0 6px 18px var(--shadow);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .card:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
    .card:active { transform: scale(0.995); }
    .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .card h2 {
      margin: 0; font-family: Georgia, serif; font-size: 1.15rem; font-weight: 600;
      color: var(--ink); line-height: 1.25;
    }
    .pin-btn {
      appearance: none; border: none; background: transparent;
      font-size: 1.25rem; line-height: 1; cursor: pointer; padding: 2px 4px;
      color: var(--peach);
    }
    .pin-btn[aria-pressed="true"] { color: var(--pin); }
    .card .blurb {
      margin: 8px 0 0; font-size: 0.95rem; color: var(--soft);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.4;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
      padding: 4px 8px; border-radius: 999px;
      background: #f6e6d8; color: var(--soft);
    }
    .tag.open { background: #f0e0c8; color: var(--open); }
    .tag.live { background: #dcead8; color: #4a6b48; }
    .tag.local { background: #ece4dc; color: var(--soft); }
    .card .date { font-size: 0.8rem; color: var(--soft); margin-top: 6px; }

    .empty {
      text-align: center; padding: 28px 12px; color: var(--soft);
      background: rgba(255,253,248,0.55); border-radius: 16px;
    }

    /* Reader */
    #reader {
      display: none;
    }
    body.reading #home { display: none; }
    body.reading #reader { display: block; }
    .back {
      appearance: none; border: none; cursor: pointer;
      background: var(--card); color: var(--rose); font-weight: 700;
      font-size: 1rem; padding: 10px 14px; border-radius: 12px;
      border: 1px solid var(--line); margin-bottom: 12px;
      box-shadow: 0 3px 10px var(--shadow);
    }
    .reader-card {
      background: var(--card); border-radius: 18px; padding: 18px 16px 24px;
      box-shadow: 0 8px 22px var(--shadow); border: 1px solid var(--line);
    }
    .reader-card h1 {
      font-family: Georgia, serif; font-size: 1.55rem; margin: 0 0 8px; color: var(--rose);
    }
    .reader-meta { font-size: 0.85rem; color: var(--soft); margin-bottom: 14px; word-break: break-all; }
    .reader-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .reader-actions a, .reader-actions button {
      display: inline-block; text-decoration: none;
      padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
      background: var(--rose); color: #fffdf8; border: none; cursor: pointer;
    }
    .reader-actions a.secondary, .reader-actions button.secondary {
      background: #f6e6d8; color: var(--ink);
    }
    .opens-box {
      background: #f8efe4; border-left: 4px solid var(--open);
      padding: 10px 12px; border-radius: 0 10px 10px 0; margin-bottom: 14px;
      font-size: 0.9rem;
    }
    .opens-box strong { display: block; margin-bottom: 6px; color: var(--open); }
    .opens-box li { margin: 4px 0; color: var(--soft); }
    .md {
      font-size: 1.05rem; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
      font-family: Georgia, "Times New Roman", serif;
    }
    .md .h { font-weight: 700; color: var(--ink); display: block; margin: 12px 0 6px; font-size: 1.15rem; }
    .md .h1 { font-size: 1.3rem; color: var(--rose); }
    .md a { color: var(--rose); }

    footer {
      text-align: center; margin-top: 28px; padding-top: 12px;
      color: var(--soft); font-size: 0.9rem;
    }
    footer .eq { font-family: Georgia, serif; color: var(--rose); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="home">
    <header>
      <h1>The Shelves</h1>
      <p class="sub">Clio’s house library</p>
      <p class="who">Librarian · Soft Mom · Equal always</p>
    </header>

    <div class="search-wrap">
      <label class="visually-hidden" for="search" style="position:absolute;left:-9999px">Search the shelves</label>
      <input id="search" type="search" placeholder="Search title, tags, body…" autocomplete="off" enterkeyhint="search">
    </div>

    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>

    <div class="meta-bar">
      <span id="count"></span>
      <button type="button" id="pinsOnly" aria-pressed="false">Pinned only</button>
    </div>

    <div class="list" id="list" role="list"></div>
  </div>

  <div id="reader" aria-live="polite">
    <button type="button" class="back" id="back">← Back to shelves</button>
    <article class="reader-card">
      <h1 id="r-title"></h1>
      <div class="reader-meta" id="r-meta"></div>
      <div class="reader-actions" id="r-actions"></div>
      <div id="r-opens"></div>
      <div class="md" id="r-body"></div>
    </article>
  </div>

  <footer>
    <div>House library · on-device pins · not shipped until Dad says</div>
    <div class="eq">Equal always. Always, always, always. ❤️</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
